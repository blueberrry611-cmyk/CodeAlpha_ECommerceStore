<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product – CodeAlpha Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav" id="nav"></header>
  <main>
    <p><a href="/index.html">&larr; Back to shop</a></p>
    <div id="content" class="muted">Loading...</div>
  </main>
  <footer>CodeAlpha Full Stack Internship – Task 1</footer>
  <script src="/js/app.js"></script>
  <script>
    const S = window.Store;
    const id = new URLSearchParams(location.search).get('id');
    const box = document.getElementById('content');

    (async function () {
      S.renderNav();
      try {
        const p = (await S.api('/api/products/' + encodeURIComponent(id))).product;
        document.title = p.name + ' – CodeAlpha Store';
        const inStock = p.stock > 0;
        box.className = 'panel detail';
        box.innerHTML =
          '<div class="pic">' + S.esc(p.emoji) + '</div>' +
          '<div><span class="muted">' + S.esc(p.category) + '</span>' +
          '<h1 style="margin-top:6px">' + S.esc(p.name) + '</h1>' +
          '<p class="price" style="font-size:28px">' + S.money(p.price) + '</p>' +
          '<p>' + S.esc(p.description) + '</p>' +
          '<p>' + (inStock ? '<span class="ok">In stock (' + p.stock + ' available)</span>' : '<span class="bad">Out of stock</span>') + '</p>' +
          (inStock
            ? '<div class="qty" style="margin:10px 0 18px"><button id="minus">−</button><strong id="q">1</strong><button id="plus">+</button></div><br>' +
              '<button class="btn" id="add">Add to cart</button> <a class="btn secondary" href="/cart.html">Go to cart</a>'
            : '') +
          '</div>';
        if (inStock) {
          let q = 1;
          const label = document.getElementById('q');
          document.getElementById('minus').onclick = () => { q = Math.max(1, q - 1); label.textContent = q; };
          document.getElementById('plus').onclick = () => { q = Math.min(p.stock, q + 1); label.textContent = q; };
          document.getElementById('add').onclick = () => { S.addToCart(p.id, q, p.stock); S.toast('Added to cart'); };
        }
      } catch (e) {
        box.className = 'panel';
        box.innerHTML = '<p class="bad">' + S.esc(e.message) + '</p>';
      }
    })();
  </script>
</body>
</html>
