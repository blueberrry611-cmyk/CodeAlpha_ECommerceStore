<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CodeAlpha Store</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="nav" id="nav"></header>
  <main>
    <h1>All Products</h1>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search products...">
      <select id="category"><option value="">All categories</option></select>
    </div>
    <div id="grid" class="grid"></div>
    <p id="empty" class="muted" style="display:none">No products match your search.</p>
  </main>
  <footer>CodeAlpha Full Stack Internship – Task 1</footer>
  <script src="/js/app.js"></script>
  <script>
    const S = window.Store;
    const grid = document.getElementById('grid');
    const catSel = document.getElementById('category');
    const search = document.getElementById('search');
    let categoriesLoaded = false, timer;

    async function load() {
      const params = new URLSearchParams();
      if (search.value.trim()) params.set('q', search.value.trim());
      if (catSel.value) params.set('category', catSel.value);
      try {
        const data = await S.api('/api/products?' + params.toString());
        if (!categoriesLoaded) {
          data.categories.forEach((c) => {
            const o = document.createElement('option'); o.value = c; o.textContent = c; catSel.appendChild(o);
          });
          categoriesLoaded = true;
        }
        document.getElementById('empty').style.display = data.products.length ? 'none' : 'block';
        grid.innerHTML = data.products.map((p) =>
          '<div class="card"><a href="/product.html?id=' + p.id + '"><div class="pic">' + S.esc(p.emoji) + '</div></a>' +
          '<div class="body"><span class="cat">' + S.esc(p.category) + '</span>' +
          '<a class="name" href="/product.html?id=' + p.id + '">' + S.esc(p.name) + '</a>' +
          '<span class="price">' + S.money(p.price) + '</span>' +
          (p.stock > 0
            ? '<button class="btn" data-add="' + p.id + '" data-stock="' + p.stock + '">Add to cart</button>'
            : '<button class="btn" disabled>Out of stock</button>') +
          '</div></div>').join('');
      } catch (e) {
        grid.innerHTML = '<p class="bad">' + S.esc(e.message) + '</p>';
      }
    }

    grid.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-add]');
      if (!btn) return;
      S.addToCart(btn.dataset.add, 1, Number(btn.dataset.stock));
      S.toast('Added to cart');
    });
    search.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(load, 250); });
    catSel.addEventListener('change', load);

    S.renderNav();
    load();
  </script>
</body>
</html>
